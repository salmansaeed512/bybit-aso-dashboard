name: Refresh ASC Analytics Data

on:
  schedule:
    # Runs daily at 07:00 UTC — Apple finalises yesterday's data overnight
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write   # Required to commit and push updated index.html

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch App Store Connect data
        env:
          ASC_ISSUER_ID:   ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID:      ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_APP_ID:      ${{ secrets.ASC_APP_ID }}
        run: node scripts/fetch-asc.js

      - name: Commit and push if data changed
        run: |
          git config user.name  "asc-data-bot"
          git config user.email "actions@github.com"
          git add index.html asc-state.json
          git diff --staged --quiet \
            && echo "No changes to commit." \
            || (git commit -m "chore: refresh ASC data $(date -u +'%Y-%m-%d')" && git push)
